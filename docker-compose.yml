# bx-admin-agent 容器编排（生产建议：把 mongo 换成外部托管 URI，并前置 HTTPS 反代/Ingress）
services:
  # ---- MongoDB（本地/迁移期便捷；生产请用外部托管并改 MONGO_URI）----
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---- 后端 agent-server ----
  agent-server:
    build:
      context: .
      dockerfile: apps/agent-server/Dockerfile
    # 直接复用开发机已有的 .env（含全部模型配置）；该文件已被 .dockerignore 排除，不进镜像。
    # 下方 environment 覆盖容器必需的几项，避免取到里面的本地值（如 MONGO_URI=127.0.0.0.1）。
    env_file: apps/agent-server/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      AGENT_DATA_DIR: "/data"
      MONGO_URI: "mongodb://mongo:27017"
      WEB_ORIGIN: "http://localhost:8080"
      # 管理令牌：从项目根 .env（已被 gitignore 排除）读取；根 .env 当前为占位值可启动，生产请设强随机串
      AGENT_ADMIN_TOKEN: "${AGENT_ADMIN_TOKEN}"
    volumes:
      - agent-data:/data
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8787"
    healthcheck:
      # 端口就绪即视为可接入（Mongo 连接失败会在业务层以 503 体现，不阻断入口）
      test: ["CMD", "node", "-e", "require('net').connect(8787,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- 前端 web（nginx：静态托管 + 反代 /agent）----
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      agent-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  agent-data:
