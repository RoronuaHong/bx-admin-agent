server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 API：同源反代，去掉 /agent 前缀转发到 agent-server:8787
    # （与 vite.config.ts 的 dev proxy rewrite 行为一致：/agent/chat -> /chat）
    location /agent/ {
        proxy_pass http://agent-server:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 聊天走 SSE 流式：关闭缓冲与缓存，延长超时，避免响应被 nginx 攒批
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 前端静态资源（带 hash 的长缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback：未命中文件一律回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
